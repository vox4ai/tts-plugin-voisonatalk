[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-plugin-voisonatalk"
version = "0.1.0"
description = "VoiSona Talk Editor 向け TTS Plugin (本体発声専用)"
requires-python = ">=3.10"
dependencies = [
    "tts-plugin-bridge",
    "aiohttp>=3.9",
]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
test = [
    "aioresponses>=0.7.0",
    "pytest-asyncio",
]

[project.entry-points."tts_bridge.connectors"]
voisonatalk = "tts_plugin_voisonatalk.connector:VoiSonaTalkConnector"

[tool.uv.sources]
tts-plugin-bridge = { path = "../tts-plugin-bridge", editable = true }

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
